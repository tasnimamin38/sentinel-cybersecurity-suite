server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Docker's embedded DNS resolves service names at request time. Keeping
    # the upstream in a variable lets nginx -t run during image build, before
    # the Compose network and the "api" service exist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Browser API calls stay on the console origin; Nginx reaches the API
    # over the private sentinel-web network.
    location ^~ /api/ {
        set $sentinel_api_upstream api:8000;
        proxy_pass http://$sentinel_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Send intentional decoy paths to the API so the runtime detector can
    # record the probe. Never serve a real config or repository file here.
    location ~* ^/(?:\\.env(?:/.*)?|\\.git(?:/.*)?|\\.aws(?:/.*)?|wp-admin(?:/.*)?|wp-login\\.php|phpmyadmin(?:/.*)?|adminer\\.php|actuator/env|server-status|\\.well-known/sentinel-canary)$ {
        set $sentinel_api_upstream api:8000;
        proxy_pass http://$sentinel_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpe?g)$ {
        expires 7d;
        try_files $uri =404;
    }
}
