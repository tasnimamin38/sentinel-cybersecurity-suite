name: CI

on:
  push:
    branches: [main, 'feat/sentinel-*']
  pull_request:
    branches: [main, 'feat/sentinel-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and tests
    runs-on: ubuntu-latest
    env:
      SENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff==0.17.4 pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Validate backup and restore scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_check_postgres.sh
      - name: Backend tests
        run: python -m pytest -q
      - name: Ruff format
        run: ruff format --check app tests scripts alembic
      - name: Ruff lint
        run: ruff check app tests scripts alembic

  frontend:
    name: Frontend security and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build

  containers:
    name: Container image and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose interpolation and structure
        env:
          POSTGRES_PASSWORD: "ci-only-not-a-secret"
          SENTINEL_API_KEY: "ci-only-placeholder-key-not-for-deployment"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "http://localhost:8080"
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t sentinel-api:ci .
      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t sentinel-console:ci .
