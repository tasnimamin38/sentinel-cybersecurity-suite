name: CI

on:
  push:
    branches: [main, 'feat/sentinel-*']
  pull_request:
    branches: [main, 'feat/sentinel-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and tests
    runs-on: ubuntu-latest
    env:
      SENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff==0.17.4 pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Validate backup and restore scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_check_postgres.sh
      - name: Backend tests
        run: python -m pytest -q
      - name: Ruff format
        run: ruff format --check app tests scripts alembic
      - name: Ruff lint
        run: ruff check app tests scripts alembic

  frontend:
    name: Frontend security and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build

  containers:
    name: Container image and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose interpolation and structure
        env:
          POSTGRES_PASSWORD: "ci-only-not-a-secret"
          SENTINEL_API_KEY: "ci-only-placeholder-key-not-for-deployment"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "http://localhost:8080"
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t sentinel-api:ci .
      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t sentinel-console:ci .
      - name: Exercise PostgreSQL backup and isolated restore verification
        run: |
          set -Eeuo pipefail
          compose_file="$(mktemp "$RUNNER_TEMP/sentinel-backup-compose.XXXXXX")"
          backup_dir="$(mktemp -d "$RUNNER_TEMP/sentinel-backups.XXXXXX")"
          export COMPOSE_FILE="$compose_file"
          export COMPOSE_PROJECT_NAME="sentinel-backup-restore-ci-$GITHUB_RUN_ID"
          cleanup() {
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f -- "$compose_file"
            rm -rf -- "$backup_dir"
          }
          trap cleanup EXIT
          cat > "$compose_file" <<'YAML'
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: sentinel
                POSTGRES_USER: sentinel
                POSTGRES_PASSWORD: backup-restore-ci-only
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
                interval: 2s
                timeout: 2s
                retries: 30
          YAML
          docker compose up -d --wait db
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U sentinel -d sentinel <<'SQL'
          CREATE TABLE public.alembic_version (version_num varchar(32) NOT NULL);
          INSERT INTO public.alembic_version VALUES ('ci-test-revision');
          CREATE TABLE public.assets (id bigint);
          CREATE TABLE public.assessments (id bigint);
          CREATE TABLE public.remediation_tasks (id bigint);
          CREATE TABLE public.audit_events (id bigint);
          CREATE TABLE public.assessment_jobs (id bigint);
          CREATE TABLE public.api_credentials (id bigint);
          CREATE TABLE public.api_credential_usage (id bigint);
          SQL
          bash backend/scripts/backup_postgres.sh "$backup_dir"
          backup_file="$(find "$backup_dir" -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$backup_file"
          test "$(stat -c '%a' "$backup_dir")" = "700"
          original_hash="$(awk '{print $1}' "$backup_file.sha256")"
          corrupt_file="$backup_dir/corrupt.dump"
          cp "$backup_file" "$corrupt_file"
          printf '%s  %s\n' "$original_hash" "$(basename "$corrupt_file")" > "$corrupt_file.sha256"
          printf 'corruption-test' >> "$corrupt_file"
          if bash backend/scripts/restore_check_postgres.sh "$corrupt_file"; then
            echo "Corrupted archive unexpectedly passed checksum validation." >&2
            exit 1
          fi
          bash backend/scripts/restore_check_postgres.sh "$backup_file"
          remaining="$(docker ps -a --filter name=sentinel-restore-check- --format '{{.Names}}')"
          if [[ -n "$remaining" ]]; then
            echo "Disposable restore containers were not cleaned up." >&2
            exit 1
          fi
