name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff==0.17.4 pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Ruff format
        run: ruff format --check app tests alembic
      - name: Ruff lint
        run: ruff check app tests alembic

  frontend:
    name: Frontend security and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build
