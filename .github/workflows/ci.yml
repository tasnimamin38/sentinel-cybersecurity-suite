name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/sentinel-*', 'fix/sentinel-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
      SENTINEL_TEST_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff==0.17.4 pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Ruff format
        run: ruff format --check app tests alembic
      - name: Ruff lint
        run: ruff check app tests alembic
      - name: Validate PostgreSQL migration upgrade and downgrade
        env:
          SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head

  frontend:
    name: Frontend security and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build

  containers:
    name: Container image and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose interpolation and structure
        env:
          POSTGRES_PASSWORD: "ci-only-not-a-secret"
          SENTINEL_DB_APP_PASSWORD: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          REDIS_PASSWORD: "ci-only-redis-password"
          SENTINEL_API_KEY: "ci-only-placeholder-key-not-for-deployment"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "https://console.example.com"
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t sentinel-api:ci .
      - name: Scan backend image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sentinel-api:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t sentinel-console:ci .
      - name: Scan frontend image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sentinel-console:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
          skip-setup-trivy: true
      - name: Exercise same-origin console-to-API proxy in Compose
        env:
          POSTGRES_PASSWORD: "ci-db-ci-db-ci-db-ci-db-ci-db"
          SENTINEL_DB_APP_PASSWORD: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          REDIS_PASSWORD: "ci-redis-ci-redis-ci-redis-ci-redis"
          SENTINEL_API_KEY: "ci-api-ci-api-ci-api-ci-api-ci-api"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "https://console.example.com"
        run: |
          docker compose up --build --detach
          docker compose exec -T api python -c '
          import os, time, urllib.request
          key = os.environ["SENTINEL_API_KEY"]
          url = "http://console:8080/api/v1/config"
          last_error = None
          for attempt in range(30):
              request = urllib.request.Request(url, headers={"X-API-Key": key})
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      body = response.read()
                  if b"network_policy" not in body:
                      raise RuntimeError("Console proxy response did not contain API config.")
                  print("Same-origin Nginx-to-API proxy returned authenticated config.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Same-origin proxy smoke test failed: {last_error}")
          '
          docker compose exec -T api python -c '
          from sqlalchemy import text
          from app.database import engine
          with engine.connect() as connection:
              role = connection.execute(text("SELECT current_user, rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolbypassrls FROM pg_roles WHERE rolname = current_user")).one()
              assert role[0] == "sentinel_app" and not any(role[1:]), role
              assert not connection.scalar(text("SELECT has_schema_privilege(current_user, \'public\', \'CREATE\')"))
          print("API uses the restricted, non-DDL PostgreSQL runtime role.")
          '
          docker compose exec -T worker python -c '
          from sqlalchemy import text
          from app.database import engine
          with engine.connect() as connection:
              role = connection.execute(text("SELECT current_user, rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolbypassrls FROM pg_roles WHERE rolname = current_user")).one()
              assert role[0] == "sentinel_app" and not any(role[1:]), role
              assert not connection.scalar(text("SELECT has_schema_privilege(current_user, \'public\', \'CREATE\')"))
          print("Worker uses the restricted, non-DDL PostgreSQL runtime role.")
          '
      - name: Tear down Compose smoke stack
        if: always()
        env:
          POSTGRES_PASSWORD: "ci-db-ci-db-ci-db-ci-db-ci-db"
          SENTINEL_DB_APP_PASSWORD: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          REDIS_PASSWORD: "ci-redis-ci-redis-ci-redis-ci-redis"
          SENTINEL_API_KEY: "ci-api-ci-api-ci-api-ci-api-ci-api"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "https://console.example.com"
        run: docker compose down --volumes --remove-orphans
