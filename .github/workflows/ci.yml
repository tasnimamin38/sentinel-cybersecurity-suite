name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/sentinel-*', 'fix/sentinel-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff==0.17.4 pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Validate backup and restore scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_check_postgres.sh
      - name: Backend tests
        run: python -m pytest -q
      - name: Ruff format
        run: ruff format --check app tests scripts alembic
      - name: Ruff lint
        run: ruff check app tests scripts alembic
      - name: Validate PostgreSQL migration upgrade and downgrade
        env:
          SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:ci-only-postgres-password@localhost:5432/sentinel_test
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head

  frontend:
    name: Frontend security and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependency lock
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build

  containers:
    name: Container image and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose interpolation and structure
        env:
          POSTGRES_PASSWORD: "ci-only-not-a-secret"
          SENTINEL_API_KEY: "ci-only-placeholder-key-not-for-deployment"
          SENTINEL_ALLOWED_DOMAINS: "example.com"
          SENTINEL_CORS_ORIGINS: "http://localhost:8080"
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t sentinel-api:ci .

      - name: Scan backend image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sentinel-api:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t sentinel-console:ci .

      - name: Scan frontend image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sentinel-console:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
          skip-setup-trivy: true
      - name: Start production Compose stack and verify migrations
        env:
          SENTINEL_ALLOWED_DOMAINS: example.com
          SENTINEL_CORS_ORIGINS: http://localhost:8080
        run: |
          set -Eeuo pipefail
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export SENTINEL_API_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$SENTINEL_API_KEY"
          export COMPOSE_PROJECT_NAME="sentinel-compose-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose up -d --build

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            docker compose ps --all
            docker compose logs --no-color db migrate api
            exit 1
          fi

          migration_container="$(docker compose ps --all -q migrate)"
          test -n "$migration_container"
          test "$(docker inspect "$migration_container" --format '{{.State.ExitCode}}')" = "0"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/me)" = "401"
          curl --fail --silent --show-error -H "X-API-Key: $SENTINEL_API_KEY" \
            http://127.0.0.1:8000/api/v1/me | grep -q '"role":"admin"'
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz | grep -q '"status":"ready"'
          console_html=""
          console_ready=0
          for _ in $(seq 1 30); do
            if console_html="$(curl --fail --silent http://127.0.0.1:8080/)"; then
              console_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$console_ready" -ne 1 ]]; then
            docker compose ps --all || true
            docker compose port console 8080 || true
            console_container="$(docker compose ps --all -q console)"
            if [[ -n "$console_container" ]]; then
              docker inspect "$console_container" --format 'state={{.State.Status}} exit={{.State.ExitCode}} ports={{json .NetworkSettings.Ports}} networks={{json .NetworkSettings.Networks}}' || true
              docker compose exec -T console sh -c 'busybox wget -qO- http://127.0.0.1:8080/' || true
            fi
            ss -ltnp | grep ':8080' || true
            docker compose logs --no-color console
            exit 1
          fi
          grep -qi 'sentinel' <<< "$console_html"
          console_port="$(docker compose port console 8080)"
          test "$console_port" = "127.0.0.1:8080"

          web_network_options="$(docker network inspect "${COMPOSE_PROJECT_NAME}_sentinel-web" --format '{{json .Options}}')"
          grep -q '"com.docker.network.bridge.enable_ip_masquerade":"false"' <<< "$web_network_options"

          if docker compose exec -T console sh -c 'busybox wget -q -T 3 -O- http://example.com/ >/dev/null 2>&1'; then
            echo "Console unexpectedly has outbound Internet access despite disabled IP masquerading."
            exit 1
          fi
          docker compose ps
      - name: Install backup encryption runtime
        run: python -m pip install --disable-pip-version-check "cryptography>=50.0.2,<51"
      - name: Exercise encrypted PostgreSQL backup and isolated restore verification
        env:
          SENTINEL_BACKUP_ENCRYPTION_KEY_ID: ci-run-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          compose_file="$(mktemp "$RUNNER_TEMP/sentinel-backup-compose.XXXXXX")"
          backup_dir="$(mktemp -d "$RUNNER_TEMP/sentinel-backups.XXXXXX")"
          export COMPOSE_FILE="$compose_file"
          export COMPOSE_PROJECT_NAME="sentinel-backup-restore-ci-$GITHUB_RUN_ID"
          export SENTINEL_BACKUP_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          echo "::add-mask::$SENTINEL_BACKUP_ENCRYPTION_KEY"
          correct_key="$SENTINEL_BACKUP_ENCRYPTION_KEY"
          export TMPDIR=/dev/shm
          cleanup() {
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f -- "$compose_file"
            rm -rf -- "$backup_dir"
          }
          trap cleanup EXIT
          cat > "$compose_file" <<'YAML'
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: sentinel
                POSTGRES_USER: sentinel
                POSTGRES_PASSWORD: backup-restore-ci-only
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
                interval: 2s
                timeout: 2s
                retries: 30
          YAML
          docker compose up -d --wait db
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U sentinel -d sentinel <<'SQL'
          CREATE TABLE public.alembic_version (version_num varchar(32) NOT NULL);
          INSERT INTO public.alembic_version VALUES ('ci-test-revision');
          CREATE TABLE public.assets (id bigint);
          CREATE TABLE public.assessments (id bigint);
          CREATE TABLE public.remediation_tasks (id bigint);
          CREATE TABLE public.audit_events (id bigint);
          CREATE TABLE public.assessment_jobs (id bigint);
          CREATE TABLE public.api_credentials (id bigint);
          CREATE TABLE public.api_credential_usage (id bigint);
          SQL
          bash backend/scripts/backup_postgres.sh "$backup_dir"
          backup_file="$(find "$backup_dir" -maxdepth 1 -type f -name '*.dump.enc' -print -quit)"
          test -n "$backup_file"
          test "$(stat -c '%a' "$backup_dir")" = "700"
          test "$(stat -c '%a' "$backup_file")" = "600"
          python3 - "$backup_file" <<'PY'
          import pathlib, sys
          content = pathlib.Path(sys.argv[1]).read_bytes()
          assert content.startswith(b"SNTLBK01"), "Encrypted backup marker is missing."
          assert not content.startswith(b"PGDMP"), "Plaintext PostgreSQL dump was published."
          PY
          if find "$backup_dir" -maxdepth 1 -type d -name '.sentinel-backup.*' | grep -q .; then
            echo "Plaintext/staging backup directory was not cleaned up." >&2
            exit 1
          fi

          wrong_key="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          echo "::add-mask::$wrong_key"
          export SENTINEL_BACKUP_ENCRYPTION_KEY="$wrong_key"
          if bash backend/scripts/restore_check_postgres.sh "$backup_file"; then
            echo "Wrong encryption key unexpectedly passed backup authentication." >&2
            exit 1
          fi
          export SENTINEL_BACKUP_ENCRYPTION_KEY="$correct_key"
          if docker ps -a --filter name=sentinel-restore-check- --format '{{.Names}}' | grep -q .; then
            echo "Wrong-key restore unexpectedly created a PostgreSQL container." >&2
            exit 1
          fi

          tampered_file="$backup_dir/tampered.dump.enc"
          cp "$backup_file" "$tampered_file"
          printf 'ciphertext-tamper' >> "$tampered_file"
          tampered_digest="$(sha256sum "$tampered_file" | awk '{print $1}')"
          printf '%s  %s\n' "$tampered_digest" "$(basename "$tampered_file")" > "$tampered_file.sha256"
          if bash backend/scripts/restore_check_postgres.sh "$tampered_file"; then
            echo "Tampered ciphertext unexpectedly passed authenticated decryption." >&2
            exit 1
          fi
          if docker ps -a --filter name=sentinel-restore-check- --format '{{.Names}}' | grep -q .; then
            echo "Tamper test unexpectedly created a PostgreSQL container." >&2
            exit 1
          fi

          bash backend/scripts/restore_check_postgres.sh "$backup_file"
          remaining="$(docker ps -a --filter name=sentinel-restore-check- --format '{{.Names}}')"
          if [[ -n "$remaining" ]]; then
            echo "Disposable restore containers were not cleaned up." >&2
            exit 1
          fi
