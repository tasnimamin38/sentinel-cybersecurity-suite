name: Bug report
description: Report a reproducible defect in SENTINEL.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, customer information or targets you are not authorized to disclose."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide safe, minimal steps using a local or authorized environment.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SENTINEL version / commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove API keys, tokens, personal data and private infrastructure details.
    validations:
      required: false