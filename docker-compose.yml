services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentinel-data]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SENTINEL_ENVIRONMENT: production
      SENTINEL_PROCESS_ROLE: api
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_API_KEYS: ${SENTINEL_API_KEYS:-}
      SENTINEL_ALLOWED_DOMAINS: ${SENTINEL_ALLOWED_DOMAINS:?Set SENTINEL_ALLOWED_DOMAINS in .env}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:8080}
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-8}
      SENTINEL_MAX_REQUEST_BODY_BYTES: ${SENTINEL_MAX_REQUEST_BODY_BYTES:-524288}
      SENTINEL_MAX_ASSESSMENT_RECORDS: ${SENTINEL_MAX_ASSESSMENT_RECORDS:-250}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    ports: ["127.0.0.1:8000:8000"]
    networks: [sentinel-data, sentinel-egress]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      SENTINEL_ENVIRONMENT: production
      SENTINEL_PROCESS_ROLE: worker
      SENTINEL_ALLOWED_DOMAINS: ${SENTINEL_ALLOWED_DOMAINS:?Set SENTINEL_ALLOWED_DOMAINS in .env}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-8}
      SENTINEL_MAX_ASSESSMENT_RECORDS: ${SENTINEL_MAX_ASSESSMENT_RECORDS:-250}
    depends_on:
      api:
        condition: service_healthy
    networks: [sentinel-data, sentinel-egress]

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    networks: [sentinel-web]

volumes:
  sentinel-db:

networks:
  sentinel-data:
    internal: true
  sentinel-web:
    internal: true
  sentinel-egress:
    driver: bridge
