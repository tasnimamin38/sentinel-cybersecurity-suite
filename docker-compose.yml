services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentinel-data]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [sentinel-data]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SENTINEL_ENVIRONMENT: production
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_API_KEYS: ${SENTINEL_API_KEYS:-}
      SENTINEL_ALLOWED_DOMAINS: ${SENTINEL_ALLOWED_DOMAINS:?Set SENTINEL_ALLOWED_DOMAINS in .env}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:8080}
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-8}
      SENTINEL_MAX_ASSESSMENT_RECORDS: ${SENTINEL_MAX_ASSESSMENT_RECORDS:-250}
      SENTINEL_MAX_REQUEST_BODY_BYTES: ${SENTINEL_MAX_REQUEST_BODY_BYTES:-524288}
      SENTINEL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SENTINEL_RATE_LIMIT_WINDOW_SECONDS: ${SENTINEL_RATE_LIMIT_WINDOW_SECONDS:-60}
      SENTINEL_API_RATE_LIMIT_PER_MINUTE: ${SENTINEL_API_RATE_LIMIT_PER_MINUTE:-120}
      SENTINEL_IP_RATE_LIMIT_PER_MINUTE: ${SENTINEL_IP_RATE_LIMIT_PER_MINUTE:-300}
      SENTINEL_ASSESSMENT_RATE_LIMIT_PER_MINUTE: ${SENTINEL_ASSESSMENT_RATE_LIMIT_PER_MINUTE:-10}
      SENTINEL_SECRET_SCAN_RATE_LIMIT_PER_MINUTE: ${SENTINEL_SECRET_SCAN_RATE_LIMIT_PER_MINUTE:-20}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    ports: ["127.0.0.1:8000:8000"]
    networks: [sentinel-data, sentinel-egress]

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    networks: [sentinel-web]

volumes:
  sentinel-db:

networks:
  sentinel-data:
    internal: true
  sentinel-web:
    internal: true
  sentinel-egress:
    driver: bridge
