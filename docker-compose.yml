services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentinel-data]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass $$REDIS_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [sentinel-data]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SENTINEL_ENVIRONMENT: production
      SENTINEL_PROCESS_ROLE: api
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_API_KEYS: ${SENTINEL_API_KEYS:-}
      SENTINEL_API_CREDENTIALS_JSON: ${SENTINEL_API_CREDENTIALS_JSON:-}
      SENTINEL_ALLOWED_DOMAINS: ${SENTINEL_ALLOWED_DOMAINS:?Set SENTINEL_ALLOWED_DOMAINS in .env}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:8080}
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-8}
      SENTINEL_MAX_REQUEST_BODY_BYTES: ${SENTINEL_MAX_REQUEST_BODY_BYTES:-524288}
      SENTINEL_MAX_ASSESSMENT_RECORDS: ${SENTINEL_MAX_ASSESSMENT_RECORDS:-250}
      SENTINEL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SENTINEL_TRUSTED_PROXY_CIDRS: ${SENTINEL_TRUSTED_PROXY_CIDRS:-172.30.240.0/24}
      SENTINEL_RATE_LIMIT_WINDOW_SECONDS: ${SENTINEL_RATE_LIMIT_WINDOW_SECONDS:-60}
      SENTINEL_API_RATE_LIMIT_PER_MINUTE: ${SENTINEL_API_RATE_LIMIT_PER_MINUTE:-120}
      SENTINEL_IP_RATE_LIMIT_PER_MINUTE: ${SENTINEL_IP_RATE_LIMIT_PER_MINUTE:-300}
      SENTINEL_HONEYPOT_EVENT_LIMIT_PER_MINUTE: ${SENTINEL_HONEYPOT_EVENT_LIMIT_PER_MINUTE:-10}
      SENTINEL_SECURITY_EVENT_AUDIT_LIMIT_PER_MINUTE: ${SENTINEL_SECURITY_EVENT_AUDIT_LIMIT_PER_MINUTE:-10}
      SENTINEL_ASSESSMENT_RATE_LIMIT_PER_MINUTE: ${SENTINEL_ASSESSMENT_RATE_LIMIT_PER_MINUTE:-10}
      SENTINEL_SECRET_SCAN_RATE_LIMIT_PER_MINUTE: ${SENTINEL_SECRET_SCAN_RATE_LIMIT_PER_MINUTE:-20}
      SENTINEL_AUTH_FAILURE_THRESHOLD: ${SENTINEL_AUTH_FAILURE_THRESHOLD:-5}
      SENTINEL_AUTH_FAILURE_WINDOW_SECONDS: ${SENTINEL_AUTH_FAILURE_WINDOW_SECONDS:-300}
      SENTINEL_SECURITY_ALERT_WEBHOOK_URL: ${SENTINEL_SECURITY_ALERT_WEBHOOK_URL:-}
      SENTINEL_SECURITY_ALERT_WEBHOOK_SECRET: ${SENTINEL_SECURITY_ALERT_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    ports: ["127.0.0.1:8000:8000"]
    networks: [sentinel-data, sentinel-web, sentinel-egress]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      SENTINEL_ENVIRONMENT: production
      SENTINEL_PROCESS_ROLE: worker
      SENTINEL_ALLOWED_DOMAINS: ${SENTINEL_ALLOWED_DOMAINS:?Set SENTINEL_ALLOWED_DOMAINS in .env}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-8}
      SENTINEL_MAX_ASSESSMENT_RECORDS: ${SENTINEL_MAX_ASSESSMENT_RECORDS:-250}
    depends_on:
      api:
        condition: service_healthy
    networks: [sentinel-data, sentinel-egress]

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    networks: [sentinel-web]

volumes:
  sentinel-db:

networks:
  sentinel-data:
    internal: true
  sentinel-web:
    internal: true
    ipam:
      config:
        - subnet: ${SENTINEL_WEB_SUBNET:-172.30.240.0/24}
  sentinel-egress:
    driver: bridge
