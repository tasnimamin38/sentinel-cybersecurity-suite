      <circle cx="0" cy="0" r="1.2" fill="#64dacc" fill-opacity=".2"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
