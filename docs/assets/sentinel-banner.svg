<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">SENTINEL Defensive Security Operations</title>
  <desc id="desc">A dark cybersecurity operations banner with a geometric shield, network lines, scan rings and a technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091624"/>
      <stop offset=".55" stop-color="#0b1b29"/>
      <stop offset="1" stop-color="#07111b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a9c9e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#63e6cc" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e0cf"/>
      <stop offset="1" stop-color="#4da4d7"/>
